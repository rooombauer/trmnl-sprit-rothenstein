name: Küchen-Display (Rechnen, Vokabeln EN/AR, gute Nachrichten)

on:
  schedule:
    # GitHub startet geplante Läufe oft stark verspätet (28.09.: 5 h). Deshalb mehrere
    # Läufe pro Nacht; die Daten enthalten ohnehin 7 Tage Vorrat, das Markup wählt per Datum.
    - cron: "17 21,23 * * *"
    - cron: "17 1,3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# alle Daten-Workflows committen ins selbe Repo: nie gleichzeitig pushen
concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Aufgaben erzeugen
        run: python scripts/make_rechnen.py

      - name: Vokabeln auswählen
        run: python scripts/make_vokabeln.py

      - name: Gute Nachrichten holen
        run: python scripts/make_news.py

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rechnen.json data/vokabeln.json data/arabisch.json data/news.json data/news_shown.json
          git diff --cached --quiet || git commit -m "Küchen-Display: $(date -u +%Y-%m-%d)"
          git pull --rebase --quiet
          git push
