name: Küchen-Display (Rechnen + gute Nachrichten)

on:
  schedule:
    - cron: "0 1 * * *"   # täglich 01:00 UTC = 03:00 Sommerzeit / 02:00 Winterzeit; Puffer für verspätete GitHub-Läufe, Frühstück ist 06:00
  workflow_dispatch: {}

permissions:
  contents: write

# alle Daten-Workflows committen ins selbe Repo: nie gleichzeitig pushen
concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Aufgaben erzeugen
        run: python scripts/make_rechnen.py

      - name: Gute Nachrichten holen
        run: python scripts/make_news.py

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rechnen.json data/news.json
          git diff --cached --quiet || git commit -m "Küchen-Display: $(date -u +%Y-%m-%d)"
          git pull --rebase --quiet
          git push
